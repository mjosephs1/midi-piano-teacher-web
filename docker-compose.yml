services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: midi_piano_teacher
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
